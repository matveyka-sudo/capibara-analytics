server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /data/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
