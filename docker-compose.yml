services:
  postgres:
    image: postgres:16-alpine
    container_name: hack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hack
      POSTGRES_PASSWORD: hack
      POSTGRES_DB: marketplace
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run only for a fresh database volume.
      - ./scripts/init:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hack -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional SQL UI: docker compose --profile tools up -d
  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:8
    container_name: hack_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: hack@local.dev
      PGADMIN_DEFAULT_PASSWORD: hack
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
